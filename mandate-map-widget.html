<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mandate Map Widget</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;font-size:12px}
#map{width:100%;height:340px;border-radius:8px 8px 0 0;overflow:hidden}
.controls{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border:1px solid #e2e8f0;border-top:none;flex-wrap:wrap}
.ctrl-lbl{font-size:11px;font-weight:600;color:#64748b;white-space:nowrap}
#mandate-slider{flex:1;min-width:120px;accent-color:#2563eb}
#month-lbl{font-size:12px;font-weight:700;color:#1e293b;min-width:5.5rem}
.play-btn{font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;cursor:pointer;white-space:nowrap;transition:all .15s}
.play-btn:hover{border-color:#2563eb;color:#2563eb}
.play-btn.playing{background:#2563eb;border-color:#2563eb;color:#fff}
.legend{display:flex;gap:14px;padding:7px 12px;background:#fff;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:5px;font-size:11px;color:#475569}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
#tip{position:fixed;z-index:9999;pointer-events:none;display:none;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 13px;font-size:11.5px;line-height:1.6;color:#64748b;box-shadow:0 4px 14px rgba(0,0,0,.1);max-width:260px}
.t-bl{font-weight:700;font-size:12.5px;color:#1e293b;margin-bottom:2px}
.t-row{display:flex;justify-content:space-between;gap:10px}
.t-val{font-weight:600;color:#1e293b}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;margin-left:4px}
.b-full{background:#fee2e2;color:#991b1b}
.b-part{background:#fef3c7;color:#92400e}
.b-none{background:#f1f5f9;color:#64748b}
.b-hh{background:#dbeafe;color:#1d4ed8}
</style>
</head>
<body>
<div id="map"></div>
<div class="controls">
  <span class="ctrl-lbl">Month:</span>
  <input type="range" id="mandate-slider" min="0" max="95" value="48" step="1">
  <span id="month-lbl">2023-01</span>
  <button class="play-btn" id="play-btn">▶ Play</button>
</div>
<div class="legend">
  <div class="swatch"><div class="sw" style="background:#e2e8f0"></div>No mandate</div>
  <div class="swatch"><div class="sw" style="background:#fde68a"></div>Commercial Neubau only</div>
  <div class="swatch"><div class="sw" style="background:#dc2626"></div>Full mandate (incl. private)</div>
</div>
<div id="tip"></div>

function mandateColor(score){
  if(score===0) return'#e2e8f0';
  if(score===1) return'#fde68a';
  return'#dc2626';
}

function styleFeature(feature){
  const bl=feature.properties.Bundesland;
  const month=MONTHS[monthIdx];
  const ts=MANDATE_TS[bl];
  const idx=ts?ts.months.indexOf(month):-1;
  const score=idx>=0?ts.score[idx]:0;
  return{fillColor:mandateColor(score),fillOpacity:.85,color:'#475569',weight:.8};
}

  let left=e.clientX+16,top=e.clientY+16;
  if(left+tip.offsetWidth>window.innerWidth-8) left=e.clientX-tip.offsetWidth-16;
  if(top+tip.offsetHeight>window.innerHeight-8) top=e.clientY-tip.offsetHeight-16;
  tip.style.left=left+'px'; tip.style.top=top+'px';
});

function showTip(bl){
  const month=MONTHS[monthIdx];
  const ts=MANDATE_TS[bl];
  const idx=ts?ts.months.indexOf(month):-1;
  const score=idx>=0?ts.score[idx]:0;
  const priv=idx>=0?ts.priv[idx]:0;
  const comm=idx>=0?ts.comm[idx]:0;
  const labels=['No mandate','Commercial only','Full mandate (Comm + Private)'];
  const bCls=['b-none','b-part','b-full'][score]||'b-none';
  const isHH=bl==='Hamburg';
  tip.innerHTML=`<div class="t-bl">${bl}${isHH?'<span class="badge b-hh">Treatment</span>':''}<span class="badge ${bCls}">${labels[score]||'—'}</span></div>
    <div style="color:${comm?'#16a34a':'#94a3b8'};font-size:11px">${comm?'✓':'✗'} Commercial Neubau</div>
    <div style="color:${priv?'#16a34a':'#94a3b8'};font-size:11px">${priv?'✓':'✗'} Private Neubau (incl. residential)</div>`;
  tip.style.display='block';
}

function onEachFeature(feature,layer){
  layer.on({
    mouseover(e){e.target.setStyle({weight:2.5,color:'#2563eb',fillOpacity:.95});showTip(feature.properties.Bundesland);},
    mouseout(e){geojsonLayer.resetStyle(e.target);tip.style.display='none';}
  });
}

fetch('bundeslaender.geojson').then(r=>r.json()).then(geo=>{
  geojsonLayer=L.geoJSON(geo,{style:styleFeature,onEachFeature}).addTo(map);
}).catch(err=>console.error('GeoJSON error:',err));

const slider=document.getElementById('mandate-slider');
const monthLbl=document.getElementById('month-lbl');
function updateMap(){
  monthLbl.textContent=MONTHS[monthIdx];
  if(geojsonLayer) geojsonLayer.setStyle(styleFeature);
}
slider.addEventListener('input',()=>{monthIdx=+slider.value;updateMap();});

function stopPlay(){
  playing=false;clearInterval(playTimer);
  const btn=document.getElementById('play-btn');
  btn.textContent='▶ Play';btn.classList.remove('playing');
}
document.getElementById('play-btn').addEventListener('click',()=>{
  if(playing){stopPlay();return;}
  playing=true;
  const btn=document.getElementById('play-btn');
  btn.textContent='⏸ Pause';btn.classList.add('playing');
  if(monthIdx>=MONTHS.length-1) monthIdx=0;
  playTimer=setInterval(()=>{
    monthIdx++;slider.value=monthIdx;updateMap();
    if(monthIdx>=MONTHS.length-1) stopPlay();
  },150);
});
</script>
</body>
</html>
